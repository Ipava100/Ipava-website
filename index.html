<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پذیرش قوانین - IPA VA</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    .form-container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    label { display: block; margin: 10px 0 5px; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
    .rules { background: #f0f8ff; padding: 15px; border-radius: 6px; margin: 15px 0; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>پذیرش قوانین</h2>
    
    <div class="rules">
      <p><strong>قوانین:</strong> با ارسال این فرم، شما موافقت می‌کنید که اطلاعات شما جمع‌آوری و ذخیره شود. این اطلاعات تنها برای اهداف داخلی استفاده می‌شود.</p>
    </div>

    <form action="https://formspree.io/f/" method="POST">
      <label>
        <input type="checkbox" name="موافقت" required> من قوانین را خوانده و می‌پذیرم
      </label>

      <label for="name">نام:</label>
      <input type="text" id="name" name="نام" required>

      <label for="family">نام خانوادگی:</label>
      <input type="text" id="family" name="نام_خانوادگی" required>

      <label for="phone">شماره تلفن:</label>
      <input type="tel" id="phone" name="تلفن" required placeholder="09123456789">

      <button type="submit">تایید و ارسال</button>
    </form>
  </div>
</body>
</html>
